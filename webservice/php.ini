; webservice/php.ini

; Éles környezetben kapcsoljuk ki a hibák kiírását
display_errors = Off
log_errors = On

; Erőforrás korlátok
memory_limit = 128M
max_execution_time = 30
post_max_size = 8M
upload_max_filesize = 2M

; Időzóna beállítás (ajánlott a konzisztencia érdekében)
date.timezone = Europe/Budapest

; Adatbázis driver beállítások
mysqli.reconnect = On
pdo_mysql.default_socket =