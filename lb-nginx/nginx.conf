# lb-nginx/nginx.conf (VÉGLEGES VERZIÓ)

# EZ A FŐ NGINX HTTP BLOKK
events {
    # Alapértelmezett érték: 1024 kapcsolat worker process-enként
    worker_connections 1024; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # A kérés továbbításának gyorsítótár beállításai (globális direktíva)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=BACKEND:10m inactive=60m;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    # 1. UPSTREAM BLOKK: A Webszerverek definiálása
    upstream webszerverek {
        server webszerver-1:80;
        server webszerver-2:80;
    }

    # 2. SERVER BLOKK: A Külvilág felé történő kiszolgálás
    server {
        listen 80;
        server_name localhost;

        # Caching engedélyezése és beállításai
        proxy_cache BACKEND;
        proxy_cache_valid 200 60m; 
        proxy_cache_revalidate on;

        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Served-By $upstream_addr;

        location / {
            # Terheléselosztás: forgalom átadása az upstream csoportnak
            proxy_pass http://webszerverek;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}